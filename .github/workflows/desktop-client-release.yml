name: Desktop Client Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub tag/release to publish client downloads under
        required: true
        default: desktop-client-latest
      release_name:
        description: Human-friendly release name
        required: true
        default: Desktop Client Latest

permissions:
  contents: write

concurrency:
  group: desktop-client-release-${{ github.event.inputs.release_tag || 'desktop-client-latest' }}
  cancel-in-progress: false

jobs:
  windows-client:
    name: Windows Desktop Client
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Sync client dependencies
        shell: pwsh
        run: |
          Set-Location clients/desktop
          uv sync

      - name: Build client
        shell: pwsh
        run: |
          Set-Location clients/desktop
          ./build.ps1

      - name: Package Windows archive
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "PlayPalace-windows-x64"
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item -Recurse clients/desktop/dist/PlayPalace (Join-Path $stage "PlayPalace")
          Copy-Item LICENSE (Join-Path $stage "LICENSE")
          New-Item -ItemType Directory -Path release | Out-Null
          Compress-Archive -Path "$stage\\*" -DestinationPath "release/PlayPalace-windows-x64.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-client-windows
          path: release/PlayPalace-windows-x64.zip

  linux-client:
    name: Linux Desktop Client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install wxPython build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libsdl2-dev libnotify-dev libsm-dev \
            libgstreamer-gl1.0-0 freeglut3-dev pkg-config

      - name: Sync client dependencies
        run: |
          cd clients/desktop
          uv sync

      - name: Build client
        run: |
          cd clients/desktop
          ./build.sh

      - name: Package Linux archive
        run: |
          stage="$RUNNER_TEMP/PlayPalace-linux-x86_64"
          rm -rf "$stage"
          mkdir -p "$stage"
          cp -a clients/desktop/dist/PlayPalace "$stage/PlayPalace"
          cp LICENSE "$stage/LICENSE"
          mkdir -p release
          tar -C "$RUNNER_TEMP" -czf release/PlayPalace-linux-x86_64.tar.gz PlayPalace-linux-x86_64

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-client-linux
          path: release/PlayPalace-linux-x86_64.tar.gz

  macos-client:
    name: macOS Desktop Client
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Sync client dependencies
        run: |
          cd clients/desktop
          uv sync

      - name: Build client
        run: |
          cd clients/desktop
          chmod +x ./build.sh
          ./build.sh

      - name: Package macOS archive
        run: |
          app_path=""
          if [ -d clients/desktop/dist/PlayPalace.app ]; then
            app_path="clients/desktop/dist/PlayPalace.app"
          elif [ -d clients/desktop/dist/PlayPalace ]; then
            app_path="clients/desktop/dist/PlayPalace"
          else
            echo "Unable to find macOS build output" >&2
            exit 1
          fi

          stage="$RUNNER_TEMP/PlayPalace-macos-x64"
          rm -rf "$stage"
          mkdir -p "$stage"
          cp LICENSE "$stage/LICENSE"
          if [[ "$app_path" == *.app ]]; then
            ditto "$app_path" "$stage/PlayPalace.app"
          else
            cp -a "$app_path" "$stage/PlayPalace"
          fi
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent "$stage" release/PlayPalace-macos-x64.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-client-macos
          path: release/PlayPalace-macos-x64.zip

  publish-release:
    name: Publish Desktop Release
    runs-on: ubuntu-latest
    needs:
      - windows-client
      - linux-client
      - macos-client
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || 'desktop-client-latest' }}
          name: ${{ github.event.inputs.release_name || 'Desktop Client Latest' }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          draft: false
          overwrite_files: true
          files: |
            release-assets/**/*.zip
            release-assets/**/*.tar.gz
